# Production on the VPS. Shares the host's PostgreSQL (port 5433) and sits behind Caddy in the network "web".
services:
  redefluss:
    build: .
    container_name: redefluss
    restart: unless-stopped
    env_file: [{ path: .env, required: false }]
    environment:
      TZ: Europe/Berlin
      DATABASE_URL: jdbc:postgresql://host.docker.internal:5433/redefluss
      DB_USER: redefluss
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY required}
      SPEECH: openai
      PRONUNCIATION: azure
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-germanywestcentral}
      AZURE_SECONDS_PER_MONTH: "16200"
    stop_grace_period: 1m
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 768m
    networks: [web]

networks:
  web:
    external: true
